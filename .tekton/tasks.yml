apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  steps:
    - name: cleanup
      image: python:3.11
      script: |
        #!/usr/bin/env python
        echo "Cleaning up workspace..."
        rm -rf /tmp/test-files
        echo "Cleanup completed successfully."

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose-test
spec:
  steps:
    - name: run-tests
      image: python:3.11
      script: |
        #!/usr/bin/env python
        pip install nose
        echo "Running unit tests..."
        nosetests
